# SometeoPR — Nginx reverse proxy config
# Include this in your main nginx config or sites-enabled/
# SSL is handled by the main nginx server block

server {
    listen 80;
    server_name someteopr.example.com;

    # Redirect HTTP → HTTPS (uncomment when SSL is set up)
    # return 301 https://$host$request_uri;

    # ── API routes → FastAPI backend ──
    # Strips /api prefix: /api/claims → /claims on backend
    location /api/ {
        proxy_pass http://127.0.0.1:8100/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if needed later)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for long-running API calls
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── Health check (direct, no /api prefix) ──
    location = /health {
        proxy_pass http://127.0.0.1:8100/health;
        proxy_set_header Host $host;
    }

    # ── Frontend static files (served by nginx directly) ──
    # In Docker setup, these are baked into the container.
    # If serving via nginx on host, point root to the built frontend dist.
    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # For SPA: try files, fallback to index.html
        # (handled by FastAPI static mount in container)
    }

    # ── Security headers ──
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Gzip ──
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
}
